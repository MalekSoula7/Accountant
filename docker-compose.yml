services:
  postgres:
    image: postgres:16-alpine
    container_name: comptashield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: comptashield
      POSTGRES_PASSWORD: DevP@ss2026!
      POSTGRES_DB: comptashield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comptashield"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comptashield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: comptashield-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: comptashield
      RABBITMQ_DEFAULT_PASS: DevP@ss2026!
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: comptashield-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: comptashield
      MINIO_ROOT_PASSWORD: DevP@ss2026!
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: comptashield-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 comptashield DevP@ss2026! &&
      mc mb --ignore-existing local/comptashield-vault &&
      mc version enable local/comptashield-vault &&
      mc retention set --default COMPLIANCE 365d local/comptashield-vault &&
      echo 'MinIO bucket initialized with versioning and object lock'
      "

volumes:
  pgdata:
  miniodata:
